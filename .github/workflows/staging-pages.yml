name: Deploy SN$ staging preview

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sns-staging-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout SN$ development branch
        uses: actions/checkout@v4
        with:
          repository: jh1528/sns-web
          ref: feature/careers-application
          persist-credentials: false

      - name: Configure staging GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website

      - name: Deploy staging preview
        id: deployment
        uses: actions/deploy-pages@v4
